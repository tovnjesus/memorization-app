<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <title>암송앱</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .verse-card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .week {
      color: #5271ff;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .verse {
      font-size: 20px;
      line-height: 1.7;
      margin: 20px 0;
    }

    .reference {
      text-align: right;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #adminButton {
      background: #eeeeee;
      color: #333;
      margin-bottom: 20px;
    }

    #recordButton {
      background: #5271ff;
      color: white;
    }

    #recordButton.recording {
      background: #e53935;
    }

    #completeButton {
      background: #e8f5e9;
      color: #2e7d32;
    }

    #completeButton:disabled {
      background: #eeeeee;
      color: #999;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #666;
    }

    #completeMessage {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 12px;
      font-weight: bold;
    }

    #video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
      display: none;
    }

    #adminPanel {
      display: none;
      background: white;
      padding: 24px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    #adminPanel h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .save-button {
      background: #5271ff;
      color: white;
    }

    .close-button {
      background: #eeeeee;
      color: #333;
    }

    #adminStatus {
      text-align: center;
      color: #5271ff;
      margin-top: 15px;
    }

    .recording-item {
      background: #f5f7fa;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .recording-name {
      font-weight: bold;
      font-size: 17px;
    }

    .recording-date {
      margin-top: 5px;
      color: #666;
    }

    .recording-class {
      margin-top: 5px;
      color: #5271ff;
      font-weight: bold;
    }

    .recording-video {
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      background: #000;
    }

    .delete-button {
      background: #e53935;
      color: white;
      margin-top: 12px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📖 아장교회 초등부 암송앱</h1>


  <button id="adminButton">
    ⚙️ 관리자
  </button>


  <!-- =========================
       관리자 화면
  ========================= -->

  <div id="adminPanel">

    <h2>⚙️ 관리자</h2>


    <label>

    <input

      id="adminDate"

    <label>
      성경 구절
    </label>

    <input
      type="text"
      id="adminReference"

    >


    <label>

    <textarea

      placeholder="암송할 말씀을 입력하세요."
    ></textarea>


    <button
      class="save-button"
      id="saveVerseButton"
    >

    </button>


    <button

      닫기
    </button>


    <button

    <div id="adminStatus"></div>

      "
    >


    <h2>📹 암송 영상 확인</h2>


    <div id="recordingList">

    </div>

  </div>


  <!-- =========================

  ========================= -->

  <div class="subtitle">
    이번 주 말씀을 암송해 보세요

    <div

      <div

    <label for="userName">

    </label>

    <input

    <label for="className">

      <option value="">
        반을 선택해주세요

      <option value="R1&2">

      <option value="R3">

      <option value="R4">

      </option>

      <option value="R5">

      </option>

      <option value="R6">
        R6

      <option value="R7">

      </option>

      <option value="R8">

      </option>

      <option value="R9">
        R9

      </option>

<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   Supabase 연결
================================================== */

const SUPABASE_URL =
  "https://zqfzdbdhkkzamicdwonl.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxZnpkYmRoa2t6YW1pY2R3b25sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM2OTksImV4cCI6MjEwMjc0OTY5OX0.TGBIE7jFHkMRQ-dMdei-wrS8XTUQPIpTW_84P8AeAMA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


supabaseClient.auth.getSession()
  .then(({ data, error }) => {

    console.log(
      "현재 Supabase 세션:",
      data.session
    );

    console.log(
      "세션 확인 오류:",
      error
    );

  });


/* ==================================================
   기본 암송 구절
================================================== */

const defaultVerses = [

  {
    week: "2026-08-23",
    text:
      "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라",
    reference:
      "요한복음 3:16"
  },

  {
    week: "2026-08-30",
    text:
      "여호와는 나의 목자시니 내게 부족함이 없으리로다",
    reference:
      "시편 23:1"
  },

  {
    week: "2026-09-06",
    text:
      "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라",
    reference:
      "빌립보서 4:13"
  }

];


let savedVerses = [];


/* ==================================================
   오늘 날짜
================================================== */

function getToday() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


/* ==================================================
   Supabase에서 구절 가져오기
================================================== */

async function loadVerses() {

  try {

    const result =
      await supabaseClient
        .from("verses")
        .select("*")
        .order(
          "week",
          {
            ascending: true
          }
        );


    if (result.error) {

      console.error(
        "Supabase 오류:",
        result.error
      );

      savedVerses =
        defaultVerses;

    }

    else if (
      result.data &&
      result.data.length > 0
    ) {

      savedVerses =
        result.data;

      console.log(
        "Supabase 구절:",
        result.data
      );

    }

    else {

      savedVerses =
        defaultVerses;

    }


    showVerse();


    document
      .getElementById("status")
      .textContent =
      "동영상 촬영 버튼을 눌러 암송을 촬영해 보세요.";

  }

  catch (error) {

    console.error(
      "Supabase 연결 오류:",
      error
    );

    savedVerses =
      defaultVerses;

    showVerse();

  }

}


/* ==================================================
   현재 주차 구절
================================================== */

function getCurrentVerse() {

  const today =
    getToday();

  let current =
    null;


  savedVerses.forEach(
    verse => {

      if (
        verse.week <= today
      ) {

        if (
          !current ||
          verse.week > current.week
        ) {

          current =
            verse;

        }

      }

    }
  );


  if (
    !current &&
    savedVerses.length > 0
  ) {

    current =
      savedVerses[0];

  }


  return current;

}


/* ==================================================
   화면에 구절 표시
================================================== */

function showVerse() {

  const verse =
    getCurrentVerse();


  if (!verse) {

    document
      .getElementById("weekText")
      .textContent =
      "📖 등록된 구절이 없습니다.";

    return;

  }


  document
    .getElementById("weekText")
    .textContent =
    "📅 " + verse.week;


  document
    .getElementById("verseText")
    .textContent =
    verse.text;


  document
    .getElementById("verseReference")
    .textContent =
    verse.reference;

}


/* ==================================================
   관리자 로그인
================================================== */

document
  .getElementById("adminButton")
  .addEventListener(
    "click",
    async () => {

      const email =
        prompt(
          "관리자 이메일을 입력하세요."
        );

      if (!email) {
        return;
      }


      const password =
        prompt(
          "관리자 비밀번호를 입력하세요."
        );

      if (!password) {
        return;
      }


      try {

        /* ------------------------------------------
           1. 관리자 로그인
        ------------------------------------------ */

        const result =
          await supabaseClient.auth.signInWithPassword({
            email:
              email.trim(),

            password:
              password
          });


        if (result.error) {

          console.error(
            "관리자 로그인 오류:",
            result.error
          );

          alert(
            "❌ 이메일 또는 비밀번호가 올바르지 않습니다."
          );

          return;

        }


        /* ------------------------------------------
           2. 관리자 역할 확인
        ------------------------------------------ */

        const {
          data: roleData,
          error: roleError
        } =
          await supabaseClient
            .from("admin_roles")
            .select("role")
            .eq(
              "user_id",
              result.data.user.id
            )
            .maybeSingle();


        console.log(
          "관리자 권한 확인:",
          roleData,
          roleError
        );


        if (roleError) {

          console.error(
            "관리자 권한 조회 오류:",
            roleError
          );

          alert(
            "❌ 관리자 권한을 확인할 수 없습니다.\n\n" +
            roleError.message
          );

          await supabaseClient.auth.signOut();

          return;

        }


        if (
          !roleData ||
          !roleData.role
        ) {

          await supabaseClient.auth.signOut();

          alert(
            "❌ 관리자 권한이 등록되지 않은 계정입니다."
          );

          return;

        }


        /* ------------------------------------------
           3. 담당 반 확인
        ------------------------------------------ */

        let classNames = [];


        if (
          roleData.role ===
          "super_admin"
        ) {

          console.log(
            "👑 슈퍼 어드민 로그인"
          );

        }

        else {

          const {
            data: classData,
            error: classError
          } =
            await supabaseClient
              .from("admin_classes")
              .select("class_name")
              .eq(
                "user_id",
                result.data.user.id
              );


          console.log(
            "관리자 담당 반:",
            classData,
            classError
          );


          if (classError) {

            console.error(
              "담당 반 조회 오류:",
              classError
            );

            alert(
              "❌ 담당 반 정보를 확인할 수 없습니다.\n\n" +
              classError.message
            );

            await supabaseClient.auth.signOut();

            return;

          }


          classNames =
            (classData || [])
              .map(
                row =>
                  row.class_name
              )
              .filter(Boolean);


          if (
            classNames.length === 0
          ) {

            await supabaseClient.auth.signOut();

            alert(
              "❌ 담당 반이 등록되지 않은 관리자입니다."
            );

            return;

          }

        }


        /* ------------------------------------------
           4. 관리자 정보 저장
        ------------------------------------------ */

        window.currentAdmin = {

          userId:
            result.data.user.id,

          role:
            roleData.role,

          classNames:
            classNames

        };


        console.log(
          "관리자 로그인 성공:",
          window.currentAdmin
        );


        /* ------------------------------------------
           5. 관리자 화면 표시
        ------------------------------------------ */

        document
          .getElementById("adminPanel")
          .style.display =
          "block";


        document
          .getElementById("logoutAdminButton")
          .style.display =
          "block";


        /* ------------------------------------------
           6. 영상 목록
        ------------------------------------------ */

        await loadRecordingList();

      }


      catch (error) {

        console.error(
          "관리자 로그인 오류:",
          error
        );

        alert(
          "❌ 관리자 로그인에 실패했습니다."
        );

      }

    }
  );


/* ==================================================
   관리자 닫기
================================================== */

document
  .getElementById("closeAdminButton")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("adminPanel")
        .style.display =
        "none";

    }
  );


/* ==================================================
   관리자 로그아웃
================================================== */

document
  .getElementById("logoutAdminButton")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();


      window.currentAdmin =
        null;


      document
        .getElementById("adminPanel")
        .style.display =
        "none";


      document
        .getElementById("logoutAdminButton")
        .style.display =
        "none";


      alert(
        "✅ 관리자 로그아웃되었습니다."
      );

    }
  );


/* ==================================================
   관리자 암송 영상 불러오기
================================================== */

async function loadRecordingList() {

  const recordingList =
    document.getElementById(
      "recordingList"
    );


  recordingList.textContent =
    "☁️ 영상을 불러오는 중입니다...";


  try {

    const currentAdmin =
      window.currentAdmin;


    if (!currentAdmin) {

      recordingList.innerHTML =
        "<p>❌ 관리자 정보를 확인할 수 없습니다.</p>";

      return;

    }


    /* ==============================================
       recordings_logs 조회
    ============================================== */

    const result =
      await supabaseClient
        .from("recordings_logs")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (result.error) {

      throw result.error;

    }


    let recordings =
      result.data || [];


    /* ==============================================
       관리자별 반 필터링
       
       super_admin → 전체
       admin → 담당 반만
    ============================================== */

    if (
      currentAdmin.role !==
      "super_admin"
    ) {

      const allowedClasses =
        currentAdmin.classNames || [];


      recordings =
        recordings.filter(
          recording => {

            return (
              recording.class_name &&
              allowedClasses.includes(
                recording.class_name
              )
            );

          }
        );

    }


    /* ==============================================
       영상이 없는 경우
    ============================================== */

    if (
      recordings.length === 0
    ) {

      recordingList.innerHTML =
        "<p>📭 담당 반의 암송 영상이 없습니다.</p>";

      return;

    }


    recordingList.innerHTML =
      "";


    /* ==============================================
       영상 목록
    ============================================== */

    for (
      const recording of recordings
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "recording-item";


      /* ============================================
         이름
      ============================================ */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "recording-name";


      name.textContent =
        "👤 " +
        (
          recording.user_name ||
          "이름 없음"
        );


      /* ============================================
         날짜
      ============================================ */

      const date =
        document.createElement(
          "div"
        );


      date.className =
        "recording-date";


      date.textContent =
        "📅 " +
        (
          recording.week ||
          "-"
        );


      /* ============================================
         반
      ============================================ */

      const classInfo =
        document.createElement(
          "div"
        );


      classInfo.className =
        "recording-class";


      classInfo.textContent =
        "🏫 " +
        (
          recording.class_name ||
          "-"
        );


      /* ============================================
         Signed URL
      ============================================ */

      const signedResult =
        await supabaseClient
          .storage
          .from("recordings")
          .createSignedUrl(
            recording.file_name,
            3600
          );


      /* ============================================
         Storage 파일이 없는 경우
      ============================================ */

      if (
        signedResult.error
      ) {

        console.warn(
          "Storage에 영상이 없어 건너뜁니다:",
          recording.file_name
        );

        continue;

      }


      /* ============================================
         영상
      ============================================ */

      const video =
        document.createElement(
          "video"
        );


      video.className =
        "recording-video";


      video.controls =
        true;


      video.playsInline =
        true;


      video.src =
        signedResult.data.signedUrl;


      /* ============================================
         삭제 버튼
      ============================================ */

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "🗑️ 영상 삭제";


      deleteButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              "이 암송 영상을 삭제하시겠습니까?\n\n삭제하면 복구할 수 없습니다."
            );


          if (!confirmed) {

            return;

          }


          deleteButton.disabled =
            true;


          deleteButton.textContent =
            "⏳ 삭제 중...";


          try {

            /* ====================================
               Storage 파일 삭제
            ==================================== */

            const removeResult =
              await supabaseClient
                .storage
                .from("recordings")
                .remove([
                  recording.file_name
                ]);


            if (
              removeResult.error
            ) {

              throw removeResult.error;

            }


            /* ====================================
               DB 기록 삭제
            ==================================== */

            const deleteResult =
              await supabaseClient
                .from("recordings_logs")
                .delete()
                .eq(
                  "id",
                  recording.id
                );


            if (
              deleteResult.error
            ) {

              throw deleteResult.error;

            }


            item.remove();


            alert(
              "✅ 영상이 삭제되었습니다."
            );


            if (
              recordingList.children.length ===
              0
            ) {

              recordingList.innerHTML =
                "<p>📭 담당 반의 암송 영상이 없습니다.</p>";

            }

          }


          catch (error) {

            console.error(
              "영상 삭제 오류:",
              error
            );


            deleteButton.disabled =
              false;


            deleteButton.textContent =
              "🗑️ 영상 삭제";


            alert(
              "❌ 영상 삭제에 실패했습니다.\n\n" +
              error.message
            );

          }

        }
      );


      /* ==========================================
         화면에 추가
      ========================================== */

      item.appendChild(
        name
      );


      item.appendChild(
        date
      );


      item.appendChild(
        classInfo
      );


      item.appendChild(
        video
      );


      item.appendChild(
        deleteButton
      );


      recordingList.appendChild(
        item
      );

    }


    /* ==============================================
       Storage에 실제 영상이 없는 경우
    ============================================== */

    if (
      recordingList.children.length ===
      0
    ) {

      recordingList.innerHTML =
        "<p>📭 실제 저장된 암송 영상을 찾을 수 없습니다.</p>";

    }

  }


  catch (error) {

    console.error(
      "암송 영상 목록 불러오기 오류:",
      error
    );


    recordingList.innerHTML =
      `
      <p style="color:#e53935;">
        ❌ 영상 목록을 불러오지 못했습니다.
      </p>
      `;

  }

}


/* ==================================================
   관리자 구절 저장
================================================== */

document
  .getElementById("saveVerseButton")
  .addEventListener(
    "click",
    async () => {

      const date =
        document
          .getElementById("adminDate")
          .value;


      const reference =
        document
          .getElementById("adminReference")
          .value
          .trim();


      const text =
        document
          .getElementById("adminVerse")
          .value
          .trim();


      if (
        !date ||
        !reference ||
        !text
      ) {

        alert(
          "모든 항목을 입력해주세요."
        );

        return;

      }


      const adminStatus =
        document.getElementById(
          "adminStatus"
        );


      adminStatus.textContent =
        "☁️ 저장 중...";


      try {

        const result =
          await supabaseClient
            .from("verses")
            .upsert(
              {
                week:
                  date,

                reference:
                  reference,

                text:
                  text
              },
              {
                onConflict:
                  "week"
              }
            );


        if (
          result.error
        ) {

          throw result.error;

        }


        adminStatus.textContent =
          "✅ 온라인에 저장되었습니다.";


        await loadVerses();


        document
          .getElementById(
            "adminDate"
          )
          .value =
          "";


        document
          .getElementById(
            "adminReference"
          )
          .value =
          "";


        document
          .getElementById(
            "adminVerse"
          )
          .value =
          "";

      }


      catch (error) {

        console.error(
          "구절 저장 오류:",
          error
        );


        adminStatus.textContent =
          "❌ 저장하지 못했습니다. Supabase 설정을 확인해주세요.";

      }

    }
  );


/* ==================================================
   동영상 촬영 변수
================================================== */

let mediaRecorder =
  null;


let videoChunks =
  [];


let currentVideoBlob =
  null;


let cameraStream =
  null;


let videoMimeType =
  "video/webm";


const recordButton =
  document.getElementById(
    "recordButton"
  );


const video =
  document.getElementById(
    "video"
  );


const status =
  document.getElementById(
    "status"
  );


const completeButton =
  document.getElementById(
    "completeButton"
  );


const completeMessage =
  document.getElementById(
    "completeMessage"
  );


const verseDisplay =
  document.getElementById(
    "verseDisplay"
  );


/* ==================================================
   동영상 녹화 시작 / 종료
================================================== */

recordButton.addEventListener(
  "click",
  async () => {

    /* ==============================================
       녹화 시작
    ============================================== */

    if (
      !mediaRecorder ||
      mediaRecorder.state ===
      "inactive"
    ) {

      try {

        /* ==========================================
           이름 확인
        ========================================== */

        const userName =
          document
            .getElementById(
              "userName"
            )
            .value
            .trim();


        if (!userName) {

          alert(
            "이름을 먼저 입력해주세요."
          );

          return;

        }


        /* ==========================================
           반 확인
        ========================================== */

        const selectedClass =
          document
            .getElementById(
              "className"
            )
            .value;


        if (!selectedClass) {

          alert(
            "반을 먼저 선택해주세요."
          );

          return;

        }


        console.log(
          "녹화 시작 - 이름:",
          userName,
          "반:",
          selectedClass
        );


        /* ==========================================
           카메라 + 마이크
        ========================================== */

        cameraStream =
          await navigator
            .mediaDevices
            .getUserMedia(
              {
                video: {
                  facingMode:
                    "user",

                  width: {
                    ideal:
                      1280
                  },

                  height: {
                    ideal:
                      720
                  }
                },

                audio:
                  true
              }
            );


        /* ==========================================
           지원 형식 확인
        ========================================== */

        if (
          MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
          )
        ) {

          videoMimeType =
            "video/webm;codecs=vp9,opus";

        }

        else if (
          MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
          )
        ) {

          videoMimeType =
            "video/webm;codecs=vp8,opus";

        }

        else {

          videoMimeType =
            "video/webm";

        }


        /* ==========================================
           MediaRecorder 생성
        ========================================== */

        mediaRecorder =
          new MediaRecorder(
            cameraStream,
            {
              mimeType:
                videoMimeType
            }
          );


        videoChunks =
          [];


        /* ==========================================
           카메라 화면 표시
        ========================================== */

        video.srcObject =
          cameraStream;


        video.muted =
          true;


        video.controls =
          false;


        video.style.display =
          "block";


        await video.play();


        /* ==========================================
           영상 데이터
        ========================================== */

        mediaRecorder.ondataavailable =
          event => {

            if (
              event.data &&
              event.data.size > 0
            ) {

              videoChunks.push(
                event.data
              );

            }

          };


        /* ==========================================
           녹화 종료
        ========================================== */

        mediaRecorder.onstop =
          async () => {

            currentVideoBlob =
              new Blob(
                videoChunks,
                {
                  type:
                    videoMimeType
                }
              );


            /* ========================================
               카메라 종료
            ======================================== */

            if (
              cameraStream
            ) {

              cameraStream
                .getTracks()
                .forEach(
                  track => {

                    track.stop();

                  }
                );

            }


            /* ========================================
               녹화 영상 미리보기
            ======================================== */

            const videoURL =
              URL.createObjectURL(
                currentVideoBlob
              );


            video.srcObject =
              null;


            video.src =
              videoURL;


            video.controls =
              true;


            video.muted =
              false;


            status.textContent =
              "☁️ 동영상 파일을 저장하는 중입니다...";


            /* ========================================
               Supabase 저장
            ======================================== */

            try {

              const currentVerse =
                getCurrentVerse();


              const week =
                currentVerse
                  ? currentVerse.week
                  : getToday();


              const fileName =
                `recording_${Date.now()}.webm`;


              /* ======================================
                 Storage 업로드
              ====================================== */

              const uploadResult =
                await supabaseClient
                  .storage
                  .from("recordings")
                  .upload(
                    fileName,
                    currentVideoBlob,
                    {
                      contentType:
                        "video/webm",

                      upsert:
                        false
                    }
                  );


              if (
                uploadResult.error
              ) {

                throw uploadResult.error;

              }


              /* ======================================
                 선택한 반의 실제 문자열 값
              ====================================== */

              const selectedClass =
                document
                  .getElementById(
                    "className"
                  )
                  .value;


              if (!selectedClass) {

                throw new Error(
                  "반을 선택해주세요."
                );

              }


              console.log(
                "선택한 반:",
                selectedClass
              );


              /* ======================================
                 recordings_logs 저장
              ====================================== */

              const logResult =
                await supabaseClient
                  .from("recordings_logs")
                  .insert({
                    user_name:
                      userName,

                    file_name:
                      fileName,

                    week:
                      week,

                    class_name:
                      selectedClass
                  });


              if (
                logResult.error
              ) {

                throw logResult.error;

              }


              console.log(
                "동영상 저장 성공:",
                fileName,
                "반:",
                selectedClass
              );


              status.textContent =
                "✅ 동영상이 저장되었습니다. 영상을 확인하고 암송 완료를 눌러주세요.";


              completeButton.disabled =
                false;

            }


            catch (error) {

              console.error(
                "동영상 저장 오류:",
                error
              );


              status.textContent =
                "❌ 동영상 저장에 실패했습니다. Supabase 설정을 확인해주세요.";


              completeButton.disabled =
                true;

            }

          };


        /* ==========================================
           녹화 시작
        ========================================== */

        mediaRecorder.start();


        /* ==========================================
           말씀 숨기기
        ========================================== */

        verseDisplay.style.display =
          "none";


        recordButton.textContent =
          "⏹️ 동영상 녹화 종료";


        recordButton
          .classList
          .add(
            "recording"
          );


        status.textContent =
          "🔴 촬영 중입니다. 말씀을 암송해 주세요.";

      }


      catch (error) {

        console.error(
          "카메라 시작 오류:",
          error
        );


        if (
          error.name ===
          "NotAllowedError"
        ) {

          status.textContent =
            "⚠️ 카메라와 마이크 권한을 허용해주세요.";

        }

        else if (
          error.name ===
          "NotFoundError"
        ) {

          status.textContent =
            "⚠️ 사용할 수 있는 카메라를 찾을 수 없습니다.";

        }

        else {

          status.textContent =
            "⚠️ 카메라를 시작할 수 없습니다.";

        }

      }

    }


    /* ==============================================
       녹화 종료
    ============================================== */

    else if (
      mediaRecorder.state ===
      "recording"
    ) {

      mediaRecorder.stop();


      recordButton.textContent =
        "🎥 다시 촬영";


      recordButton
        .classList
        .remove(
          "recording"
        );

    }

  }
);


/* ==================================================
   암송 완료
================================================== */

completeButton.addEventListener(
  "click",
  () => {

    verseDisplay.style.display =
      "block";


    completeMessage.style.display =
      "block";


    completeButton.textContent =
      "✅ 암송 완료됨";


    completeButton.disabled =
      true;


    status.textContent =
      "이번 주 암송이 완료되었습니다!";

  }
);


/* ==================================================
   앱 시작
================================================== */

loadVerses();


/* ==================================================
   Service Worker
================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )

        .then(
          () => {

            console.log(
              "Service Worker 등록 완료"
            );

          }
        )

        .catch(
          error => {

            console.error(
              "Service Worker 등록 실패:",
              error
            );

          }
        );

    }
  );

}

</script>
